name: StockMind AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Data Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run synthetic data engine (Starter profile)
        run: |
          python -m data_engine.run_pipeline --profile starter --seed 20261022

      - name: Run pytest automated test suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v backend/tests

  frontend-build:
    name: Frontend TypeScript & Bundle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install npm dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
